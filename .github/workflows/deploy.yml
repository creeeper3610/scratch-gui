name: Deploy Scratch GUI to GitHub Pages

on:
  push:
    branches:
      - main # または master （あなたのリポジトリのデフォルトブランチ名に合わせてください）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: 18 # Scratch-guiが安定して動くバージョンを指定
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # 高速かつ確実にライブラリをインストール

      - name: Build HTML/JS
        run: npm run build # ここであなたが探していた「build」フォルダ（HTML）が自動生成されます

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build' # ビルドされたHTMLが入っているフォルダを指定

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
